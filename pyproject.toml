[project]
name = "fiber"
version = "0.1.0"
description = "A JAX library for SE(3) operations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.13.2",
    "jax>=0.4.38",
    "plum-dispatch>=2.9.0",
]

[tool.ruff.lint]
ignore = ["F722", "F821", "E731", "F811"]

[tool.basedpyright]
reportRedeclaration = false
