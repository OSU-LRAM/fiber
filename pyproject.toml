[build-system]
requires = ["flit_core >=3.8.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fiber"
version = "0.1.0"
description = "A JAX library for Lie group operations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "diffrax>=0.7.2",
    "equinox>=0.13.2",
    "jax>=0.4.38",
    "plum-dispatch>=2.9.0",
]

[tool.ruff.lint]
ignore = ["F722", "F821", "E731", "F811"]

[tool.basedpyright]
typeCheckingMode = "standard"
enableTypeIgnoreComments = true
reportMissingTypeStubs = "none"
